<meta name="description" content="Contactez Trait d'Épice — questions, commandes, devis professionnels et points de vente.">

<section class="section tight" style="padding-bottom:36px;">
  <div class="container">
    <span class="eyebrow">Contact</span>
    <h1 style="font-size:42px;margin-top:10px;">Parlons-en</h1>
    <p style="margin-top:14px;font-size:14px;color:var(--gray);max-width:560px;">Une question sur nos épices, une commande, une demande professionnelle&nbsp;? Écrivez-nous, nous revenons vers vous sous 48h.</p>
  </div>
</section>

<section class="section" style="background:var(--ink);">
  <div class="container" style="max-width:720px;">
    <span class="eyebrow on-dark">Formulaire</span>
    <form class="form-grid dark-form" style="margin-top:22px;" data-contact-form>
      <div class="field">
        <label for="c-name">Nom et prénom</label>
        <input id="c-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="c-etablissement">Établissement</label>
        <input id="c-etablissement" name="company" type="text" placeholder="Nom (facultatif pour un particulier)">
      </div>
      <div class="field">
        <label for="c-email">E-mail</label>
        <input id="c-email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.fr" required>
      </div>
      <div class="field">
        <label for="c-tel">Téléphone</label>
        <input id="c-tel" name="phone" type="tel" autocomplete="tel" placeholder="06 00 00 00 00">
      </div>
      <div class="field full">
        <label for="c-sujet">Sujet</label>
        <input id="c-sujet" name="subject" type="text" placeholder="Objet du message">
      </div>
      <div class="field full">
        <label for="c-message">Message</label>
        <textarea id="c-message" name="message" rows="5" placeholder="Votre message" required></textarea>
      </div>
      <div class="field full" aria-hidden="true" style="position:absolute;left:-9999px;">
        <label for="c-website">Site web</label>
        <input id="c-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="field full">
        <button type="submit" class="btn btn-gold" style="width:fit-content;">Envoyer</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="form-note" style="color:#B9B2A7;">Votre demande est envoyée directement à Trait d'Épice.</p>
      </div>
    </form>
  </div>
</section>
