<meta name="description" content="Le catalogue des épices Trait d'Épice — piments, poivres, mélanges, herbes et épices douces, sélectionnés à l'origine.">

<section class="section tight" style="padding-bottom:0;">
  <div class="container">
    <span class="eyebrow">Catalogue</span>
    <h1 style="font-size:42px;margin-top:10px;">Nos épices</h1>
    <p style="margin-top:14px;font-size:14px;color:var(--gray);max-width:560px;">Une sélection d'épices d'origine, conditionnées avec soin. {{PRODUCT_COUNT}} références disponibles.</p>
  </div>
</section>

<section class="section" style="padding-top:36px;">
  <div class="container">
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
      <input type="search" id="epice-search" placeholder="Rechercher une épice par son nom…" aria-label="Rechercher une épice">
    </div>
    <div class="filters">
      {{FILTER_PILLS}}
    </div>
    <p id="epice-search-empty" class="search-empty" hidden>Aucune épice ne correspond à votre recherche.</p>
    <div class="product-grid">
      {{ALL_PRODUCTS}}
    </div>
  </div>
</section>
